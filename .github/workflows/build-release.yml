name: Build Release Module

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Extract version and generate build info
        id: version
        run: |
          BASE_VER=$(grep '^version=' src/module.prop | cut -d= -f2)
          BUILD=$(grep '^versionCode=' src/module.prop | cut -d= -f2)
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${TAG#v}" != "$BASE_VER" ]; then
            echo "Tag ($TAG) does not match module.prop version ($BASE_VER)"
            exit 1
          fi
          case "$BASE_VER" in
            *.*.*.*) RELEASE_VERSION="v${BASE_VER%.*}-${BASE_VER##*.}" ;;
            *) RELEASE_VERSION="v${BASE_VER}" ;;
          esac
          ZIP_NAME="specter-${RELEASE_VERSION}.zip"
          MAJOR=$(echo "$BASE_VER" | cut -d. -f1)
          MINOR=$(echo "$BASE_VER" | cut -d. -f2)
          PATCH=$(echo "$BASE_VER" | cut -d. -f3)
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 1000 + PATCH * 100 + BUILD))
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "base_version=$BASE_VER" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build Android helpers
        run: bash deps/apk/build.sh

      - name: Build
        run: npm run build

      - name: Stamp release module.prop
        run: |
          sed -i "s/^version=.*/version=${{ steps.version.outputs.base_version }}/" Module/module.prop
          sed -i "s/^versionCode=.*/versionCode=${{ steps.version.outputs.version_code }}/" Module/module.prop

      - name: Package module zip
        run: |
          cd Module
          zip -r "../${{ steps.version.outputs.zip_name }}" .
          unzip -tq "../${{ steps.version.outputs.zip_name }}" deps/classes.dex

      - name: Push module to Telegram channel
        if: github.repository == 'dpejoh/specter'
        env:
          MODULE_PATH: ${{ steps.version.outputs.zip_name }}
          MODULE_VERSION: ${{ steps.version.outputs.release_version }}
          MODULE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Missing Telegram secrets. Configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in repo secrets." >&2
            exit 0
          fi

          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          COMMIT_BODY=$(git log -1 --pretty=%b)
          GIT_HASH=$(git rev-parse --short=8 HEAD)

          caption=$(python3 - <<'PY'
          import os

          def escape(s):
              return s.replace("&","&amp;").replace("<","&lt;").replace(">","&gt;")

          module_path = os.environ["MODULE_PATH"]
          module_ver  = os.environ["MODULE_VERSION"]
          module_vc   = os.environ["MODULE_VERSION_CODE"]
          subject     = os.environ.get("COMMIT_SUBJECT","")
          author      = os.environ.get("COMMIT_AUTHOR","")
          body        = os.environ.get("COMMIT_BODY","")
          git_hash    = os.environ.get("GIT_HASH","")
          branch      = os.environ.get("GITHUB_REF_NAME","")
          repo        = os.environ.get("GITHUB_REPOSITORY","")

          summary = ""
          paragraphs = []
          cur = []
          for line in body.splitlines():
              line = line.strip()
              if not line:
                  if cur:
                      paragraphs.append(" ".join(cur))
                      cur = []
                  continue
              cur.append(line)
          if cur:
              paragraphs.append(" ".join(cur))
          if paragraphs:
              summary = paragraphs[0]

          lines = [
              f"Version: <b>{escape(module_ver)} ({escape(module_vc)})</b>",
              f"Module: <b>{escape(module_path)}</b>",
              "Commit:",
              f"<pre>{escape(subject)}</pre>",
          ]
          if summary:
              lines.insert(4, f"<pre>{escape(summary)}</pre>")
          lines += [
              f"Author: <b>{escape(author)}</b>",
              f"Branch: <b>{escape(branch)}@{escape(git_hash)}</b>",
              f"Repo: <b>{escape(repo)}</b>",
          ]

          caption = "\n".join(lines)
          cap_len = len(caption)
          if cap_len > 1024:
              excess = cap_len - 1024
              if summary:
                  trim = max(0, len(summary) - excess - 3)
                  cap = caption.replace(summary, summary[:trim].rstrip() + "..." if trim > 3 else "")
                  if len(cap) <= 1024:
                      caption = cap
              if len(caption) > 1024:
                  caption = caption[:1021].rstrip() + "..."
          print(caption)
          PY
          )

          response_file=$(mktemp)
          http_code=$(curl --silent --show-error --output "${response_file}" --write-out "%{http_code}" \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${MODULE_PATH}" \
            -F "parse_mode=HTML" \
            --form-string "caption=${caption}")

          if [ "${http_code}" != "200" ]; then
            echo "Telegram API returned HTTP ${http_code}." >&2
            cat "${response_file}" >&2
            exit 0
          fi

          message_id=$(python3 -c "
          import json,sys
          r=json.load(open('${response_file}'))
          if not r.get('ok'): sys.exit(r.get('description','API error'))
          print(r['result']['message_id'])
          ")
          echo "Telegram message_id: ${message_id}"

      - name: Extract current release notes
        run: |
          python3 - <<'PY'
          import re, sys
          ver = "${{ steps.version.outputs.release_version }}"
          with open("changelog.md") as f:
              content = f.read()
          pattern = re.compile(rf'^(# v?{re.escape(ver)}\s*.*?)(?=^# v|\Z)', re.MULTILINE | re.DOTALL)
          match = pattern.search(content)
          if match:
              with open("release-notes.md", "w") as out:
                  out.write(match.group(1).strip() + "\n")
          else:
              print(f"Section not found for version {ver}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Publish release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          ZIP_NAME: ${{ steps.version.outputs.zip_name }}
        run: |
          if assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'); then
            if ! grep -Fxq -- "$ZIP_NAME" <<< "$assets"; then
              gh release upload "$RELEASE_TAG" "$ZIP_NAME"
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "$RELEASE_VERSION" --notes-file release-notes.md "$ZIP_NAME"
          fi

      - name: Update update.json on main
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ZIP_NAME: ${{ steps.version.outputs.zip_name }}
        run: |
          git fetch origin main
          git worktree add --detach "$RUNNER_TEMP/specter-main" FETCH_HEAD
          cd "$RUNNER_TEMP/specter-main"
          ZIP_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ZIP_NAME}"
          jq --arg v "$RELEASE_VERSION" --argjson vc "$VERSION_CODE" --arg url "$ZIP_URL" \
            'if .versionCode <= $vc then .version = $v | .versionCode = $vc | .zipUrl = $url else . end' \
            update.json > update_tmp.json
          mv update_tmp.json update.json
          git add update.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: bump update.json to $RELEASE_VERSION [skip ci]"
            git push origin HEAD:main
          fi
